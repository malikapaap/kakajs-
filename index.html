.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:20;animation:f .2s both;max-width:90%;text-align:center}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<div class="media ${a&&!a.ok?"shake":""}">${q.c?`<div class="bub c">${esc(q.c)}</div>`:""}<div class="bub m">${esc(q.t)}</div>${a?`<div class="pop">${a.ok?"❤️":"💔"}</div>`:""}</div>`;
if(!a)h+=`<div class="acts"><button class="b" data-p="real">👤 Шерзат</button><button class="b s" data-p="ai">🤖 AI</button></div><div class="cap" style="color:var(--mute)">Источник сообщения скрыт</div>`;
else{let l=a.ok?rnd(q.a==="real"?RX.okR:RX.okA):rnd(q.a==="real"?RX.badR:RX.badA);if(!a.ok&&S.stk>=3)l=rnd(RX.stk);
h+=`<div class="acts"><button class="b" id="nx">${S.i===14?"Результат":"Дальше"}</button></div><div class="cap"><b class="${a.ok?"ok":"no"}">${a.ok?"Определено верно ✓":"Ошибка ✕"}</b> Это ${q.a==="real"?"написал Шерзат.":"написал AI."}<br>${l}<small>${a.ok?"+1 правильный ответ":rnd(MEME)}</small></div>`}
return h+"</article>"}
function res(){const p=pc(),c=S.ans.filter(x=>x.ok).length,L=lvl(p),R=S.q.map((q,i)=>({q,a:S.ans[i]}));
const rg=R.filter(x=>x.q.a==="real"&&x.a.ok).length,ag=R.filter(x=>x.q.a==="ai"&&x.a.ok).length,fl=R.filter(x=>x.q.a==="ai"&&!x.a.ok);
const ex=c===15?"🏆 15/15. Секретный титул: «Ломатель нейросетей».":c===0?"☠️ 0/15. Тебя обманул каждый AI.":"";
return `<div class="prof"><div class="big"><svg width="104" height="104" viewBox="0 0 104 104"><circle cx="52" cy="52" r="46" fill="none" stroke="var(--line)" stroke-width="7"/><circle id="rg" cx="52" cy="52" r="46" fill="none" stroke="#D62976" stroke-width="7" stroke-linecap="round" stroke-dasharray="289" stroke-dashoffset="289" style="transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)"/></svg><div class="n"><span id="ct">0</span>%</div></div>
<div class="stat"><div><b>${c}</b><span>верно</span></div><div><b>${15-c}</b><span>ошибок</span></div><div><b>${fl.length}</b><span>обманул AI</span></div></div></div>
<div class="bio"><b>${L[1]}</b><br>${L[2]}<br>Шерзатов угадано: ${rg}, AI угадано: ${ag}${ex?"<br><b>"+ex+"</b>":""}${fl.length?"<br><span style='color:var(--mute)'>Обманули: «"+esc(fl.slice(0,3).map(x=>x.q.t).join("», «"))+"»</span>":""}</div>
<div class="acts"><button class="b" id="again">Пройти заново</button></div>${gridH()}`}
const gridH=()=>`<div class="grid">${S.q.length?S.q.map((q,i)=>{const a=S.ans[i];return `<button class="tile ${a?(a.ok?"ok":"no"):""}" data-i="${i}">${i+1}<em>${a?(a.ok?"✓":"✕"):""}</em></button>`}).join(""):Array(15).fill(0).map((_,i)=>`<button class="tile" data-i="${i}">${i+1}</button>`).join("")}</div>`;
function hist(){return `<div class="sec">История ответов</div>${gridH()}`}
function me(){const nm=P.name||"Гость";return `<div class="prof"><div class="ring" style="flex:none"><div class="avi" style="width:84px;height:84px;font-size:34px">${esc(nm[0].toUpperCase())}</div></div><div class="stat"><div><b>${P.attempts}</b><span>попыток</span></div><div><b>${P.best==null?"—":P.best+"%"}</b><span>лучший</span></div><div><b>${P.last==null?"—":P.last+"%"}</b><span>последний</span></div></div></div>
<div class="bio"><b>${esc(nm)}</b><br>Шерзатология: ${P.last==null?0:P.last} уровень</div><input id="nm" placeholder="Твоё имя" maxlength="20" value="${esc(P.name)}"><div class="acts"><button class="b" id="sn">Сохранить имя</button></div><div class="sec">Рейтинг</div>${lb()}`}
function start(){if(!P.name){const o=sheet('<h3>Как тебя зовут?</h3><input id="n2" placeholder="Имя" maxlength="20" style="width:100%;margin:8px 0"><div class="acts" style="padding:8px 0"><button class="b" id="ok">Поехали</button></div>');o.querySelector("#ok").onclick=()=>{P.name=o.querySelector("#n2").value.trim()||"Гость";sv();o.remove();begin()}}else begin()}
function begin(){S.q=deck();S.i=0;S.ans=[];S.done=false;S.go=true;S.a=null;S.stk=0;S.tab="test";render()}
function render(){const v=$("#v");v.innerHTML=({home,test,hist,me})[S.tab]();v.className="fade";nav();
v.querySelectorAll("#go").forEach(b=>b.onclick=()=>S.go&&!S.done?(S.tab="test",render()):start());
v.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{const q=S.q[S.i],ok=b.dataset.p===q.a;S.ans.push({ok,p:b.dataset.p});S.stk=ok?0:S.stk+1;S.a={ok};if(S.stk===3)toast("AI начинает издеваться 😈");render()});
const nx=$("#nx");if(nx)nx.onclick=()=>{S.a=null;if(S.i===14){S.done=true;const p=pc();P.attempts++;P.last=p;P.best=Math.max(P.best||0,p);P.board.push({n:P.name||"Гость",p});P.board.sort((a,b)=>b.p-a.p);P.board=P.board.slice(0,5);sv()}else S.i++;render()};
const ag=$("#again");if(ag)ag.onclick=start;
v.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{const t=info[b.dataset.s];sheet(typeof t==="function"?t():t)});
v.querySelectorAll(".tile").forEach(t=>t.onclick=()=>{const i=+t.dataset.i,q=S.q[i],a=S.ans[i];if(!a){toast("Этот раунд ещё не пройден");return}
sheet(`<h3>Раунд ${i+1} ${a.ok?"✓":"✕"}</h3>${q.c?`<div class="bub c" style="max-width:100%;margin-bottom:8px">${esc(q.c)}</div>`:""}<div class="bub m" style="max-width:100%">${esc(q.t)}</div><p>Это был ${q.a==="real"?"Шерзат":"AI"}. Ты выбрала ${a.p==="real"?"Шерзата":"AI"}.</p>`)});
const sn=$("#sn");if(sn)sn.onclick=()=>{P.name=$("#nm").value.trim();sv();toast("Имя сохранено");render()};
const rg=$("#rg");if(rg){const p=pc();requestAnimationFrame(()=>requestAnimationFrame(()=>rg.style.strokeDashoffset=289*(1-p/100)));const t0=performance.now(),el=$("#ct");(function f(t){const k=Math.min(1,(t-t0)/1100);el.textContent=Math.round(p*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f)})(t0)}}
let tp=0,tt;document.addEventListener("click",e=>{if(e.target.closest("nav,.b,.tile,.st,input"))return;tp++;clearTimeout(tt);tt=setTimeout(()=>tp=0,1200);if(tp>=7){tp=0;toast("ИИ заметил, что ты тыкаешь 👀")}});
render();
</script></body></html>
